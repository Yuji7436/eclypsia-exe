name: Build ECLYPSIA EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install -g nativefier
      - run: nativefier --name "ECLYPSIA" --single-instance "file:///$(pwd)/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: ECLYPSIA-Windows
          path: ECLYPSIA-win32-x64/
